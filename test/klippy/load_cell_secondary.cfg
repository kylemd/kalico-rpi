# Regression config: a load cell used only for nozzle-contact Z-offset
# alongside a BLTouch that remains the printer's primary probe.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[bltouch]
sensor_pin: PC7
control_pin: PC5
z_offset: 1.15

[load_cell_probe]
register_as_probe: False
sensor_type: hx711
sclk_pin: PA0
dout_pin: PA1
reference_tare_counts: 0
counts_per_gram: 1
trigger_force: 75
z_offset: 0.0

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
